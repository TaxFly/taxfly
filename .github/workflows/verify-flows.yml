name: Verify TaxFly flows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run flow and PWA tests
        run: node --test tests/flow.test.cjs
