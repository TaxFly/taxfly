name = "taxfly-claude"
main = "claude-worker.js"
compatibility_date = "2024-01-01"

# Rate limiting: COST_LIMITER es por usuario logueado (uid), protege el gasto
# de Anthropic. GENERAL_LIMITER es por IP, para reCAPTCHA (no gasta crédito).
# namespace_id es solo un identificador tuyo, cualquier entero sirve.
[[ratelimits]]
name = "COST_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "GENERAL_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

# Orígenes que pueden llamar al worker desde el navegador (separados por coma).
# localhost / 127.0.0.1 siempre se permiten para probar en tu compu.
[vars]
ALLOWED_ORIGINS = "https://taxfly.github.io"
